# Render blueprint: the Django API and the static React site.
# Create it from the dashboard with New + > Blueprint; the steps are in README.md, "Deployment".
# No secret is stored here: SECRET_KEY is generated by Render and TOMTOM_API_KEY is asked for.
services:
  - type: web
    name: spotter-truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Render adds the service's own hostname to the allowed hosts by itself.
      - key: ALLOWED_HOSTS
        value: spotter-truck-routing-api.onrender.com
      # The only origin allowed to call the API from a browser: the static site below.
      - key: CORS_ALLOWED_ORIGINS
        value: https://spotter-truck-routing-web.onrender.com
      - key: TOMTOM_API_KEY
        sync: false

  - type: web
    name: spotter-truck-routing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Read at build time, so changing it needs a new build of the site.
      - key: VITE_API_BASE_URL
        value: https://spotter-truck-routing-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
